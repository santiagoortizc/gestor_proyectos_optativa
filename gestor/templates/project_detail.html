{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.name }} · Detalle del Proyecto</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <main class="max-w-3xl mx-auto px-4 py-10 sm:px-6 lg:px-8">

        <header class="mb-8">
            <a href="{% url 'projects' %}"
               class="inline-flex items-center text-sm text-gray-500 hover:text-gray-700 transition-colors duration-150">
                &larr; Volver a proyectos
            </a>
        </header>

        <article class="bg-white border border-gray-200 rounded-lg p-6 sm:p-8 shadow-sm">

            <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4 mb-6">
                <h1 class="text-2xl sm:text-3xl font-semibold text-gray-900">
                    {{ project.name }}
                </h1>

                <nav class="flex items-center gap-3 shrink-0" aria-label="Acciones del proyecto">
                  <a href="{% url 'new_task' project.id %}"
                     class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-green-600 border border-green-200 rounded-md hover:bg-green-50 transition-colors duration-150">
                      Agregar Tarea
                  </a>
                  <a href="{% url 'edit_project' project.id %}"
                     class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-blue-600 border border-blue-200 rounded-md hover:bg-blue-50 transition-colors duration-150">
                      Editar
                  </a>
                  <a href="{% url 'delete_project' project.id %}"
                      onclick="return confirm('¿Estás seguro de que deseas eliminar este proyecto?');"
                      class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-red-600 border border-red-200 rounded-md hover:bg-red-50 transition-colors duration-150">
                      Eliminar
                  </a>
                </nav>
            </div>

            <dl class="space-y-6">
                <div>
                    <dt class="text-xs font-medium uppercase tracking-wide text-gray-400">
                        Descripción
                    </dt>
                    <dd class="mt-1 text-sm text-gray-700 leading-relaxed">
                        {{ project.description }}
                    </dd>
                </div>

                <div>
                    <dt class="text-xs font-medium uppercase tracking-wide text-gray-400">
                        Duración
                    </dt>
                    <dd class="mt-1 text-sm text-gray-700">
                        {{ project.duration }}
                    </dd>
                </div>

                <!-- <div>
                    <dt class="text-xs font-medium uppercase tracking-wide text-gray-400">
                        Tareas
                    </dt>
                    <dd class="mt-1 text-sm text-gray-700">
                        {{ project.task_set.count }}
                    </dd>
                </div> -->
            </dl>

        </article>

    </main>

</body>
</html>
